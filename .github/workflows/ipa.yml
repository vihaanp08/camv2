name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcode-select -p

      # Fast gate: the platform-independent logic has real tests, and they need
      # no SDK. If these fail the IPA is not worth building.
      - name: Test Core
        continue-on-error: true
        run: ./scripts/test-core.sh

      - name: Build unsigned IPA
        run: ./scripts/build-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cam-unsigned-ipa
          path: Cam.ipa
          if-no-files-found: error
          retention-days: 90

      # Tagging gives the IPA a stable URL, which is what makes it downloadable
      # straight onto the phone.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Cam.ipa \
            --title "$GITHUB_REF_NAME" \
            --notes "Unsigned IPA. Install with Sideloadly or AltStore — they re-sign it with your own Apple ID."

      # Keep the latest IPA on its own branch, so it has a plain download link.
      - name: Publish IPA branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/pub && cp Cam.ipa /tmp/pub/
          cd /tmp/pub
          git init -q -b ipa
          git config user.name cam-ci
          git config user.email cam-ci@users.noreply.github.com
          git add Cam.ipa
          git commit -q -m "Cam.ipa for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ipa
